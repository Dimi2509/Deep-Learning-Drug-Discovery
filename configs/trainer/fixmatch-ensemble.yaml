# fixmatch-ensemble-fixed.yaml
# Key changes from original:
# 1. Higher confidence_threshold (0.3 instead of 0.06)
# 2. Lower unsupervised_weight initially (0.1 instead of 0.5)
# 3. Longer warmup (100 epochs instead of 50)
# 4. Safe augmentation config for molecular graphs

defaults:
  - _self_

method: fixmatch-ensemble

train:
  total_epochs: 250
  validation_interval: 10
  warmup_epochs: 100  # INCREASED: More warmup before using pseudo-labels

init:
  _target_: trainer.FixMatchEnsemble
  
  # Standard supervised training
  supervised_criterion:
    _target_: torch.nn.MSELoss
  
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.01
    weight_decay: 0.05
  
  scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    _partial_: true
    step_size: 1
    gamma: 0.975
  
  # FixMatch specific parameters - FIXED VALUES
  unsupervised_weight: 0.1       # REDUCED: Start with lower weight (was 0.5)
  confidence_threshold: 0.3      # INCREASED: Allow more pseudo-labels (was 0.06)
  use_ensemble_pseudolabels: true

# FIXED Augmentation config for molecular graphs
# Key principle: Don't destroy chemical information!
augmentation_config:
  weak:
    # For weak aug: minimal perturbation
    continuous_noise: 0.01       # Only noise on continuous features
    edge_drop_rate: 0.0          # NO edge dropout - bonds are chemistry!
  strong:
    # For strong aug: feature masking instead of noise
    continuous_noise: 0.05       # Small noise on continuous features
    categorical_mask_rate: 0.15  # Mask categorical features (not noise!)
    continuous_mask_rate: 0.1    # Also mask some continuous features
    edge_drop_rate: 0.1          # Very light edge dropout (was 0.4!)