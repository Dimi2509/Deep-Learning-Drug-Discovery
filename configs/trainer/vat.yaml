defaults:
  - _self_

method: vat

train:
  total_epochs: 250
  validation_interval: 10

init:
  _target_: trainer.VATTrainer
  supervised_criterion:
    _target_: torch.nn.MSELoss
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 0.0005
    weight_decay: 0.1
  scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    _partial_: true
    step_size: 1
    gamma: 0.975
  vat_xi: 1e-5 # initially 1e-5 
  vat_eps: 10 # was 0.7
  vat_ip: 5
  unsup_weight: 2.0
  unsup_ratio: 2
  
